<!DOCTYPE html>
<html lang="es" data-paleta="carbon-lima">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Crustore</title>
    <meta name="description" content="Tiendas locales, pedidos a domicilio y panel para negocios" />
    <meta name="theme-color" content="#1c1f1a" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)" />

    <!-- Ícono de pestaña -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />

    <!-- Acceso directo en iPhone / iPad (Safari › Compartir › Agregar a inicio) -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Crustore" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Acceso directo en Android / Chrome -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <style>
      .arranque { position: fixed; inset: 0; display: grid; place-items: center; align-content: center; gap: 18px; background: #f4f6ef; }
      .arranque img { width: 84px; height: 84px; object-fit: contain; animation: arranque-latido 1.4s ease-in-out infinite; }
      .arranque-anillo { width: 28px; height: 28px; border-radius: 50%; border: 3px solid rgba(120, 120, 120, 0.3); border-top-color: #8a8a8a; animation: arranque-giro 0.8s linear infinite; }
      @keyframes arranque-giro { to { transform: rotate(360deg); } }
      @keyframes arranque-latido { 50% { transform: scale(1.07); opacity: 0.85; } }
      @media (prefers-color-scheme: dark) { .arranque { background: #121410; } }
      @media (prefers-reduced-motion: reduce) { .arranque img, .arranque-anillo { animation: none; } }
    </style>

    <!-- Paleta de colores: la última que eligió el admin, antes de pintar (ver src/composables/usePaleta.ts) -->
    <script>
      try {
        var p = localStorage.getItem("paleta");
        if (["carbon-lima", "rosa-negro", "naranja-cacao", "azul-anil", "crustore"].indexOf(p) >= 0) {
          document.documentElement.dataset.paleta = p;
        } else if (p === "personalizada") {
          var css = localStorage.getItem("paleta-css");
          if (css) {
            var st = document.createElement("style");
            st.id = "paleta-personalizada";
            st.textContent = css;
            document.head.appendChild(st);
            document.documentElement.dataset.paleta = p;
          }
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app">
      <!-- Pantalla de carga: se ve desde el primer instante y Vue la reemplaza al arrancar -->
      <div class="arranque" role="status" aria-label="Cargando Crustore">
        <img src="/logo.png" alt="" width="84" height="84" />
        <span class="arranque-anillo" aria-hidden="true"></span>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
